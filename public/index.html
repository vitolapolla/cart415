<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>Encore</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <a class="brand" href="#/home"><img src="/icon.svg" alt=""><span>Encore</span></a>
      <nav class="nav">
        <a href="#/home" data-nav="home"><svg data-icon="home"></svg>Home</a>
        <a href="#/search" data-nav="search"><svg data-icon="search"></svg>Search</a>
        <a href="#/radio" data-nav="radio"><svg data-icon="radio"></svg>Radio</a>
        <a href="#/library" data-nav="library"><svg data-icon="library"></svg>Your Library</a>
      </nav>
      <div class="sidebar-section">
        <div class="sidebar-head">
          <span>Playlists</span>
          <button class="icon-btn" data-action="new-playlist" title="Create playlist"><svg data-icon="plus"></svg></button>
        </div>
        <a class="sidebar-item" href="#/liked"><span class="liked-tile"><svg data-icon="heart-fill"></svg></span>Liked Songs</a>
        <div id="sidebar-playlists"></div>
      </div>
      <a class="sidebar-foot" href="#/settings"><svg data-icon="settings"></svg>Settings &amp; Sonos</a>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>

    <aside class="panel" id="panel">
      <div class="panel-tabs">
        <button data-panel="now" class="active">Now Playing</button>
        <button data-panel="queue">Queue</button>
        <button data-panel="lyrics">Lyrics</button>
        <button class="icon-btn panel-close" data-action="toggle-panel" title="Close"><svg data-icon="close"></svg></button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <footer class="player" id="player">
      <div class="player-track">
        <img class="player-art" id="p-art" alt="">
        <div class="player-meta">
          <div class="player-title" id="p-title">Nothing playing</div>
          <div class="player-artist" id="p-artist">Pick something to listen to</div>
        </div>
        <button class="icon-btn like-btn" id="p-like" data-action="like-current" title="Like"><svg data-icon="heart"></svg></button>
      </div>
      <div class="player-center">
        <div class="controls">
          <button class="icon-btn" id="p-shuffle" data-action="shuffle" title="Shuffle (S)"><svg data-icon="shuffle"></svg></button>
          <button class="icon-btn" data-action="prev" title="Previous"><svg data-icon="prev"></svg></button>
          <button class="play-btn" id="p-play" data-action="toggle" title="Play (Space)"><svg data-icon="play"></svg></button>
          <button class="icon-btn" data-action="next" title="Next"><svg data-icon="next"></svg></button>
          <button class="icon-btn" id="p-repeat" data-action="repeat" title="Repeat (R)"><svg data-icon="repeat"></svg></button>
        </div>
        <div class="progress">
          <span id="p-time">0:00</span>
          <input type="range" id="p-seek" min="0" max="1000" value="0" aria-label="Seek">
          <span id="p-dur">0:00</span>
        </div>
      </div>
      <div class="player-right">
        <span class="cast-badge" id="cast-badge" hidden></span>
        <button class="icon-btn" data-action="sleep" id="p-sleep" title="Sleep timer"><svg data-icon="moon"></svg></button>
        <button class="icon-btn" data-panel-open="lyrics" title="Lyrics"><svg data-icon="mic"></svg></button>
        <button class="icon-btn" data-panel-open="queue" title="Queue"><svg data-icon="queue"></svg></button>
        <button class="icon-btn" id="p-cast" data-action="cast" title="Play on Sonos"><svg data-icon="speaker"></svg></button>
        <div class="volume">
          <button class="icon-btn" data-action="mute" id="p-mute" title="Mute (M)"><svg data-icon="volume"></svg></button>
          <input type="range" id="p-vol" min="0" max="100" value="80" aria-label="Volume">
        </div>
      </div>
    </footer>

    <nav class="tabbar">
      <a href="#/home" data-nav="home"><svg data-icon="home"></svg>Home</a>
      <a href="#/search" data-nav="search"><svg data-icon="search"></svg>Search</a>
      <a href="#/radio" data-nav="radio"><svg data-icon="radio"></svg>Radio</a>
      <a href="#/library" data-nav="library"><svg data-icon="library"></svg>Library</a>
    </nav>
  </div>

  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
