<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121016">
  <title>Encore</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- encore:config -->
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="paused">
  <div class="app panel-closed" id="app">
    <nav class="rail" aria-label="Main">
      <a class="rail-brand" href="#/home" title="Encore"><img src="icon.svg" alt="Encore"></a>
      <a class="nav-item" href="#/home" data-nav="home"><span class="ind"><svg data-icon="home"></svg></span>Home</a>
      <a class="nav-item" href="#/search" data-nav="search"><span class="ind"><svg data-icon="explore"></svg></span>Explore</a>
      <a class="nav-item" href="#/radio" data-nav="radio"><span class="ind"><svg data-icon="radio"></svg></span>Radio</a>
      <a class="nav-item" href="#/kids" data-nav="kids"><span class="ind"><svg data-icon="kids"></svg></span>Kids</a>
      <a class="nav-item" href="#/library" data-nav="library"><span class="ind"><svg data-icon="library"></svg></span>Library</a>
      <div class="spacer"></div>
      <a class="nav-item" href="#/settings" data-nav="settings"><span class="ind"><svg data-icon="settings"></svg></span>Settings</a>
    </nav>

    <main class="main" id="main" tabindex="-1"></main>

    <aside class="panel" id="panel" aria-label="Now playing">
      <div class="tabs">
        <button data-panel="now" class="active">Playing</button>
        <button data-panel="queue">Up next</button>
        <button data-panel="lyrics">Lyrics</button>
        <button class="icon-btn" data-action="toggle-panel" title="Close"><svg data-icon="close"></svg></button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <footer class="player" id="player">
      <div class="mini-progress"><i id="mini-progress"></i></div>
      <div class="player-track">
        <img class="player-art" id="p-art" alt="">
        <div class="player-meta">
          <div class="player-title" id="p-title">Nothing playing</div>
          <div class="player-artist" id="p-artist">Pick something to listen to</div>
        </div>
        <button class="icon-btn like-btn" data-action="like-current" title="Like"><svg data-icon="heart"></svg></button>
      </div>
      <div class="player-center">
        <div class="controls">
          <button class="icon-btn" data-action="shuffle" title="Shuffle (S)"><svg data-icon="shuffle"></svg></button>
          <button class="icon-btn" data-action="prev" title="Previous"><svg data-icon="prev"></svg></button>
          <button class="fab primary morph" data-action="toggle" title="Play (Space)"><svg data-icon="play"></svg></button>
          <button class="icon-btn" data-action="next" title="Next"><svg data-icon="next"></svg></button>
          <button class="icon-btn" data-action="repeat" title="Repeat (R)"><svg data-icon="repeat"></svg></button>
        </div>
        <div class="progress">
          <span id="p-time">0:00</span>
          <div class="wave wavy" id="p-wave"><div class="w-played"></div><div class="w-rest"></div><div class="w-thumb"></div><input type="range" id="p-seek" min="0" max="1000" value="0" aria-label="Seek"></div>
          <span id="p-dur">0:00</span>
        </div>
      </div>
      <div class="player-right">
        <button class="device-pill" id="cast-badge" data-action="cast" hidden></button>
        <button class="icon-btn" data-action="sleep" title="Sleep timer"><svg data-icon="moon"></svg></button>
        <button class="icon-btn" data-panel-open="lyrics" title="Lyrics"><svg data-icon="lyrics"></svg></button>
        <button class="icon-btn" data-panel-open="queue" title="Up next"><svg data-icon="queue"></svg></button>
        <button class="icon-btn" id="p-cast" data-action="cast" title="Play on…"><svg data-icon="speaker"></svg></button>
        <div class="volume">
          <button class="icon-btn" data-action="mute" id="p-mute" title="Mute (M)"><svg data-icon="volume"></svg></button>
          <input type="range" class="slider" id="p-vol" min="0" max="100" value="80" aria-label="Volume">
        </div>
      </div>
    </footer>

    <nav class="navbar" aria-label="Main">
      <a class="nav-item" href="#/home" data-nav="home"><span class="ind"><svg data-icon="home"></svg></span>Home</a>
      <a class="nav-item" href="#/search" data-nav="search"><span class="ind"><svg data-icon="explore"></svg></span>Explore</a>
      <a class="nav-item" href="#/radio" data-nav="radio"><span class="ind"><svg data-icon="radio"></svg></span>Radio</a>
      <a class="nav-item" href="#/kids" data-nav="kids"><span class="ind"><svg data-icon="kids"></svg></span>Kids</a>
      <a class="nav-item" href="#/library" data-nav="library"><span class="ind"><svg data-icon="library"></svg></span>Library</a>
    </nav>
  </div>

  <section class="sheet" id="sheet" aria-hidden="true" aria-label="Now playing">
    <div class="sheet-scroll">
      <header class="sheet-head">
        <button class="icon-btn" data-action="close-sheet" title="Close"><svg data-icon="chevron-down"></svg></button>
        <div class="sheet-context"><span class="label">Playing from</span><b id="s-context"></b></div>
        <button class="icon-btn" data-action="more-current" title="More options"><svg data-icon="more"></svg></button>
      </header>
      <div class="sheet-art-wrap"><img id="s-art" alt=""></div>
      <div class="sheet-meta">
        <div class="sheet-text"><div id="s-title"></div><div id="s-artist"></div></div>
        <button class="icon-btn lg" data-action="like-current" title="Like"><svg data-icon="heart"></svg></button>
      </div>
      <div id="s-onair"></div>
      <div class="sheet-progress">
        <div class="wave wavy" id="s-wave"><div class="w-played"></div><div class="w-rest"></div><div class="w-thumb"></div><input type="range" id="s-seek" min="0" max="1000" value="0" aria-label="Seek"></div>
        <div class="sheet-times"><span id="s-time">0:00</span><span id="s-dur">0:00</span></div>
      </div>
      <div class="sheet-controls">
        <button class="icon-btn" data-action="shuffle" title="Shuffle"><svg data-icon="shuffle"></svg></button>
        <button class="icon-btn lg tonal" data-action="prev" title="Previous"><svg data-icon="prev"></svg></button>
        <button class="fab lg primary morph" data-action="toggle" title="Play"><svg data-icon="play"></svg></button>
        <button class="icon-btn lg tonal" data-action="next" title="Next"><svg data-icon="next"></svg></button>
        <button class="icon-btn" data-action="repeat" title="Repeat"><svg data-icon="repeat"></svg></button>
      </div>
      <div class="sheet-chips">
        <button class="chip" id="s-cast" data-action="cast"></button>
        <button class="chip" id="s-sleep" data-action="sleep"><svg data-icon="moon"></svg>Sleep</button>
      </div>
      <div class="tabs">
        <button data-sheet-tab="queue" class="active">Up next</button>
        <button data-sheet-tab="lyrics">Lyrics</button>
        <button data-sheet-tab="about">About</button>
      </div>
      <div class="sheet-extra" id="sheet-extra"></div>
    </div>
  </section>

  <section class="video-sheet" id="video" aria-hidden="true" aria-label="Video">
    <div class="video-top">
      <button class="icon-btn" data-action="close-video" title="Close"><svg data-icon="chevron-down"></svg></button>
      <div class="grow clip" id="v-context"></div>
      <a class="icon-btn" id="v-open" target="_blank" rel="noopener" title="Open in YouTube"><svg data-icon="external"></svg></a>
    </div>
    <div class="video-frame" id="v-frame"></div>
    <div class="video-info"><div><b id="v-title"></b><small id="v-channel"></small></div>
      <a class="btn tonal" id="v-yt" target="_blank" rel="noopener"><svg data-icon="external"></svg>YouTube</a></div>
    <div class="video-list" id="v-list"></div>
  </section>

  <div class="scrim" id="backdrop" hidden></div>
  <div class="popover" id="popover" role="dialog" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
